name: Build Userland
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version d Epsilon de ta calculatrice (Parametres > A propos)"
        default: "26.4.0"
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Dependances
        run: |
          apt-get update
          apt-get install -y build-essential git imagemagick libx11-dev libxext-dev libfreetype6-dev libpng-dev libjpeg-dev libusb-1.0-0-dev pkg-config python3 python3-pip gcc-arm-none-eabi binutils-arm-none-eabi inkscape librsvg2-bin
          pip3 install --break-system-packages lz4 pypng stringcase pyelftools
          arm-none-eabi-gcc --version | head -1
      - uses: actions/checkout@v4
      - name: Code d'Epsilon (branche de ta version)
        env:
          V: ${{ inputs.version }}
        run: |
          MAJOR=${V%%.*}
          git clone --filter=blob:none --branch "version-$MAJOR" https://github.com/numworks/epsilon.git firmware || git clone --filter=blob:none https://github.com/numworks/epsilon.git firmware
          cd firmware
          echo "Branche utilisee : $(git branch --show-current)"
          git log -3 --format='%h %ad %s' --date=short
          F=$(git grep -l "EPSILON_VERSION\|APP_VERSION" -- '*Makefile' '*.mak' '*.mk' | head -5 || true)
          echo "Fichiers de version : $F"
          git grep -n "EPSILON_VERSION\|APP_VERSION" -- $F | head -10 || true
          if git grep -q -F "$V" -- $F; then
            echo "Le code public indique deja la version $V"
          else
            echo "AVERTISSEMENT : le code public n'indique pas $V. On compile le sommet de la branche et on force EPSILON_VERSION=$V (methode conseillee par NumWorks)."
          fi
          git submodule update --init --recursive || true
      - name: Theme
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          theme = json.load(open("theme/userland_theme.json"))["palette"]
          n = 0
          for f in list(pathlib.Path("firmware").rglob("palette.h")) + list(pathlib.Path("firmware").rglob("palette.cpp")):
              s = f.read_text()
              for name, col in theme.items():
                  pat = re.compile(r'(\b' + re.escape(name) + r'\b\s*=\s*KDColor::RGB24\(0x)([0-9A-Fa-f]{6})(\))')
                  s, k = pat.subn(lambda m: m.group(1) + col.lstrip('#').upper() + m.group(3), s)
                  n += k
              f.write_text(s)
          print(n, "couleur(s) modifiee(s)")
          PY
      - name: Compilation
        env:
          V: ${{ inputs.version }}
        run: |
          D=firmware/epsilon; [ -d "$D" ] || D=firmware
          ls firmware
          make -C $D clean PLATFORM=n0120 || true
          make -C $D -j4 PLATFORM=n0120 EPSILON_VERSION=$V userland.A.dfu
          make -C $D -j4 PLATFORM=n0120 EPSILON_VERSION=$V userland.B.dfu
      - name: Extraire les .bin
        run: |
          python3 - <<'PY'
          import struct, glob
          for f in glob.glob("firmware/**/userland.*.dfu", recursive=True):
              b = open(f, "rb").read()
              off = 11; i = 0
              for t in range(b[10]):
                  ne = struct.unpack_from("<I", b, off + 270)[0]; off += 274
                  for e in range(ne):
                      a, sz = struct.unpack_from("<II", b, off); off += 8
                      out = f[:-4] + (".bin" if i == 0 else "." + str(i) + ".bin")
                      open(out, "wb").write(b[off:off + sz])
                      print(out, hex(a), sz); off += sz; i += 1
          PY
      - name: Rassembler
        run: |
          mkdir -p out
          find firmware \( -name "userland.*.dfu" -o -name "userland.*.bin" \) -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: userland-n0120
          path: out/*
  site:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
