name: Reperer le code d'Epsilon
on:
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloner et lister
        run: |
          git clone --filter=blob:none https://github.com/numworks/epsilon.git firmware
          cd firmware
          git checkout cc9262e || git checkout origin/version-26 || true
          {
            echo "== commit"; git log -1 --format='%h %ad %s' --date=short
            echo "== racine"; ls
            echo "== epsilon/"; ls epsilon 2>/dev/null || true
            echo "== fichiers accueil / conteneur / eadk"; git ls-files | grep -iE "apps/home/|apps_container|eadk|external_app" | head -200
            echo "== implementation EADK"; git grep -l "eadk_display_push_rect_uniform" | head -20 || true
            echo "== apps externes (build)"; git grep -n -iE "external_apps|EXTERNAL_APPS" -- '*.mak' '*Makefile' '*.mk' | head -40 || true
          } > /tmp/recon.txt 2>&1
          wc -l /tmp/recon.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recon
          path: /tmp/recon.txt
